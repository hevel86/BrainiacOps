apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
  namespace: dns-system
  annotations:
    metallb.io/loadBalancerIPs: 10.0.0.246
    # Do not let External-DNS manage this cluster-owned node identity.
spec:
  type: LoadBalancer
  # Preserve client addresses for DNS ACLs and query logs.
  externalTrafficPolicy: Local
  selector:
    app: technitium-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: http
      port: 5380
      targetPort: http
      protocol: TCP
    - name: https
      port: 53443
      targetPort: https
      protocol: TCP
