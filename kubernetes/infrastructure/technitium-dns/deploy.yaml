apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium-dns
  namespace: dns-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: technitium-dns
  template:
    metadata:
      labels:
        app: technitium-dns
    spec:
      automountServiceAccountToken: false
      # Use Talos host DNS for bootstrap, independent of CoreDNS.
      dnsPolicy: Default
      terminationGracePeriodSeconds: 60
      containers:
        - name: technitium-dns
          # Confirm compatibility with dns1/dns2 before the first manual sync.
          image: technitium/dns-server:15.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 5380
              protocol: TCP
            - name: https
              containerPort: 53443
              protocol: TCP
          env:
            - name: DNS_SERVER_DOMAIN
              value: dns3.torquasmvo.internal
            - name: DNS_SERVER_ADMIN_PASSWORD_FILE
              value: /run/technitium-admin/admin-password
            - name: DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS
              value: "true"
            - name: DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT
              value: "true"
            - name: DNS_SERVER_RECURSION
              value: AllowOnlyForPrivateNetworks
          volumeMounts:
            - name: config
              mountPath: /etc/dns
            - name: admin-password
              mountPath: /run/technitium-admin
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          # Local-only probes must not depend on the primary or Internet DNS.
          startupProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  dig @127.0.0.1 localhost A +short +time=2 +tries=1
                  | grep -qx '127.0.0.1'
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: technitium-dns-config
        - name: admin-password
          secret:
            secretName: technitium-admin
            defaultMode: 0400
