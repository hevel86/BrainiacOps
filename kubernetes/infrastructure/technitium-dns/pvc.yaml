apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: technitium-dns-config
  namespace: dns-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-prod
  resources:
    requests:
      storage: 5Gi
