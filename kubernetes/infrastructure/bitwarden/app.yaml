# kubernetes/infrastructure/bitwarden/app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitwarden-sm-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitwarden.com
    chart: sm-operator
    targetRevision: 2.0.3 # Specify a version to ensure consistent deployments
    helm:
      values: |
        replicaCount: 1
        containers:
          manager:
            resources:
              requests:
                cpu: 35m
                memory: 160Mi
              limits:
                cpu: 500m
                memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: sm-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
