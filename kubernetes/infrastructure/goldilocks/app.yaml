apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goldilocks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: default
  source:
    repoURL: https://charts.fairwinds.com/stable
    chart: goldilocks
    targetRevision: "10.6.0"
    helm:
      values: |
        vpa:
          enabled: true
          updater:
            enabled: false
          admissionController:
            enabled: false

        metrics-server:
          enabled: false

        controller:
          flags:
            on-by-default: true
          rbac:
            enableArgoproj: false

        dashboard:
          replicaCount: 1
          flags:
            on-by-default: true
          rbac:
            enableArgoproj: false
          service:
            type: LoadBalancer
            annotations:
              external-dns.alpha.kubernetes.io/hostname: goldilocks.torquasmvo.internal
              metallb.io/loadBalancerIPs: 10.0.0.245
  destination:
    server: https://kubernetes.default.svc
    namespace: goldilocks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
