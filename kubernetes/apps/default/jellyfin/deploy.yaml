---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        component: server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: jellyfin
          # Stage 1: validate the official image before upgrading the server version.
          image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          ports:
            - containerPort: 8096
          env:
            # Preserve LinuxServer's on-disk layout on the existing PVC.
            - name: JELLYFIN_DATA_DIR
              value: /config/data
            - name: JELLYFIN_CONFIG_DIR
              value: /config
            - name: JELLYFIN_CACHE_DIR
              value: /config/cache
            - name: JELLYFIN_LOG_DIR
              value: /config/log
            - name: XDG_CACHE_HOME
              value: /config/cache
            - name: TZ
              value: "America/New_York"
          resources:
            requests:
              gpu.intel.com/i915: "1"
              cpu: 1000m
              memory: "4Gi"
            limits:
              gpu.intel.com/i915: "1"
              cpu: "4000m"
              memory: "16Gi"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tv
              mountPath: /data/tv
            - name: movies
              mountPath: /data/movies
            - name: jellyfin-transcode
              mountPath: /transcode
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-lh
        - name: tv
          persistentVolumeClaim:
            claimName: media-tv-pvc
        - name: movies
          persistentVolumeClaim:
            claimName: media-movies-pvc
        - name: jellyfin-transcode
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
