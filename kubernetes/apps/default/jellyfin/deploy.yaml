---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        component: server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Run before database migration; keep configuration and analysis in place.
        - name: quarantine-jellyfin-10-plugins
          image: jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
          command: ["/bin/sh", "-ec"]
          args:
            - |
              plugins=/config/data/plugins
              quarantine=/config/plugin-binaries-pre12
              for package in "$plugins"/*; do
                [ -d "$package" ] || continue
                name=${package##*/}
                [ "$name" = configurations ] && continue
                if [ ! -f "$package/meta.json" ]; then
                  echo "WARNING: keeping plugin without meta.json: $name" >&2
                  continue
                fi
                if ! grep -Eq '"targetAbi"[[:space:]]*:' "$package/meta.json"; then
                  echo "WARNING: keeping plugin without targetAbi: $name" >&2
                  continue
                fi
                if grep -Eq '"targetAbi"[[:space:]]*:[[:space:]]*"10\.' "$package/meta.json"; then
                  mkdir -p "$quarantine"
                  if [ -e "$quarantine/$name" ]; then
                    echo "Refusing to overwrite quarantined plugin: $name" >&2
                    exit 1
                  fi
                  mv "$package" "$quarantine/$name"
                  echo "Quarantined Jellyfin 10 plugin: $name"
                else
                  echo "Keeping plugin: $name"
                fi
              done
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
          ports:
            - containerPort: 8096
          env:
            # Preserve LinuxServer's on-disk layout on the existing PVC.
            - name: JELLYFIN_DATA_DIR
              value: /config/data
            - name: JELLYFIN_CONFIG_DIR
              value: /config
            - name: JELLYFIN_CACHE_DIR
              value: /config/cache
            - name: JELLYFIN_LOG_DIR
              value: /config/log
            - name: XDG_CACHE_HOME
              value: /config/cache
            - name: TZ
              value: "America/New_York"
          resources:
            requests:
              gpu.intel.com/i915: "1"
              cpu: 1000m
              memory: "4Gi"
            limits:
              gpu.intel.com/i915: "1"
              cpu: "4000m"
              memory: "16Gi"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tv
              mountPath: /data/tv
            - name: movies
              mountPath: /data/movies
            - name: jellyfin-transcode
              mountPath: /transcode
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-lh
        - name: tv
          persistentVolumeClaim:
            claimName: media-tv-pvc
        - name: movies
          persistentVolumeClaim:
            claimName: media-movies-pvc
        - name: jellyfin-transcode
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
