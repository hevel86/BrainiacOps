---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  labels:
    app: syncthing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      containers:
        - name: syncthing
          image: docker.io/syncthing/syncthing:2.1.7@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
          env:
            - name: TZ
              value: America/New_York
            - name: HOME
              value: /config
            - name: STHOMEDIR
              value: /config
            - name: UMASK
              value: '000'
          ports:
            - containerPort: 8384
            - containerPort: 22000
              protocol: TCP
            - containerPort: 22000
              protocol: UDP
            - containerPort: 21027
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: sync-saves
              mountPath: /sync_saves
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: syncthing-config
        - name: sync-saves
          persistentVolumeClaim:
            claimName: syncthing-sync-saves-fast-pvc
