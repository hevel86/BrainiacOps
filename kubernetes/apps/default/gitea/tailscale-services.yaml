apiVersion: v1
kind: Service
metadata:
  name: gitea-web-tailnet
  namespace: kube-system
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: gitea
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: https
      port: 443
      targetPort: gitea-tailnet
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh-tailnet
  namespace: default
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: gitea-ssh
spec:
  type: ClusterIP
  selector:
    app: gitea
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
      protocol: TCP
