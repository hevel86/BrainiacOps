apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - nextcloud-deploy.yaml
  - nextcloud-svc.yaml
  - mariadb-deploy.yaml
  - mariadb-svc.yaml
  - pvc.yaml
  - configmap.yaml
  - bitwarden-secrets.yaml
  - nextcloud-ingressroute-tcp.yaml
configMapGenerator:
  - name: nextcloud-php-hardening
    namespace: default
    files:
      - zz-security.ini=php-security.ini
      - zz-security.conf=php-security.conf
