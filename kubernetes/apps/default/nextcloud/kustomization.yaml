---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - nextcloud-deploy.yaml
  - nextcloud-svc.yaml
  - mariadb-deploy.yaml
  - mariadb-svc.yaml
  - pvc.yaml
  - configmap.yaml
  - bitwarden-secrets.yaml
  - nextcloud-ingressroute-tcp.yaml
  - mariadb-compat.yaml
configMapGenerator:
  - name: nextcloud-php-hardening
    namespace: default
    files:
      - zz-security.ini=php-security.ini
      - zz-security.conf=php-security.conf
  - name: nextcloud-official-runtime
    namespace: default
    files:
      - upgrade.sh=official-upgrade.sh
      - runtime-health.php=official-runtime-health.php
      - check-runtime.php=official-check-runtime.php
      - cron.sh=official-cron.sh
      - apps.config.php=official-apps.config.php
      - compat.ini=official-compat.ini
      - fpm.conf=official-fpm.conf
      - nginx.conf=nginx.conf
