apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: default
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nextcloud
          image: lscr.io/linuxserver/nextcloud:33.0.5
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
          ports:
            - containerPort: 443
              name: https
          envFrom:
            - configMapRef:
                name: nextcloud-env
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-db-secrets
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: php-hardening
              mountPath: /config/php/zz-security.ini
              subPath: zz-security.ini
              readOnly: true
            - name: php-hardening
              mountPath: /config/php/zz-security.conf
              subPath: zz-security.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: php-hardening
          configMap:
            name: nextcloud-php-hardening
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data-pvc
