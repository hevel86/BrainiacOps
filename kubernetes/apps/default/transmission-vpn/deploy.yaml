apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission-vpn
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transmission-vpn
  template:
    metadata:
      labels:
        app: transmission-vpn
    spec:
      # OpenVPN replaces the pod-scoped resolv.conf, which persists across
      # container restarts. Save the fresh ClusterFirst resolver once per pod.
      initContainers:
        - name: capture-cluster-dns
          image: haugene/transmission-openvpn:5.5.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - cp /etc/resolv.conf /resolver/resolv.conf
          volumeMounts:
            - name: resolver
              mountPath: /resolver
      containers:
        - name: transmission-vpn
          image: haugene/transmission-openvpn:5.5.2
          imagePullPolicy: IfNotPresent
          # Restore CoreDNS before provider setup; OpenVPN can replace it with
          # the VPN-provided resolvers again after the tunnel is established.
          command:
            - dumb-init
            - /bin/bash
            - -c
            - |
              cp /resolver/resolv.conf /etc/resolv.conf
              exec /etc/openvpn/start.sh
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          envFrom:
            - configMapRef:
                name: transmission-vpn-env
            - secretRef:
                name: transmission-vpn-secret
          env:
            # Work around haugene/transmission-openvpn 5.4.1 reading these
            # variables before its NordVPN setup script assigns them.
            - name: json_countries
              value: "[]"
            - name: json_groups
              value: "[]"
            - name: json_technologies
              value: "[]"
          ports:
            - name: web
              containerPort: 9091
              protocol: TCP
          volumeMounts:
            - name: resolver
              mountPath: /resolver
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            # - name: localtime
            #   mountPath: /etc/localtime
            #   readOnly: true
            - name: tun-device
              mountPath: /dev/net/tun
      volumes:
        - name: resolver
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: transmission-vpn-config
        - name: data
          persistentVolumeClaim:
            claimName: transmission-vpn-data
        # - name: localtime
        #   hostPath:
        #     path: /etc/localtime
        #     type: File
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
