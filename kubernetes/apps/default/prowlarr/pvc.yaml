---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-lh
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
  volumeMode: Filesystem
