---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: default
  labels:
    app: plex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: plex
          image: ghcr.io/home-operations/plex:1.43.5.11079@sha256:06ef0fc23e9af9bbaf284c3f27972f94e703d13d6f745edeb6818fcbebf6c673
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 32400
              protocol: TCP
          env:
            - name: TZ
              value: America/New_York
            - name: PLEX_PREFERENCE_TRANSCODE
              value: TranscoderTempDirectory=/scratch
          resources:
            requests:
              gpu.intel.com/i915: '1'
              cpu: 1000m
              memory: 7.5Gi
            limits:
              gpu.intel.com/i915: '1'
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /data/movies
            - name: tv
              mountPath: /data/tv
            - name: zfstranscode
              mountPath: /scratch
            - name: lily
              mountPath: /lily_gcs_cheers
            - name: abbie
              mountPath: /abbie
          startupProbe:
            httpGet:
              path: /identity
              port: http
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /identity
              port: http
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /identity
              port: http
              scheme: HTTPS
            failureThreshold: 5
            periodSeconds: 30
          securityContext:
            privileged: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config-pvc
        - name: movies
          persistentVolumeClaim:
            claimName: media-movies-pvc
        - name: tv
          persistentVolumeClaim:
            claimName: media-tv-pvc
        - name: zfstranscode
          persistentVolumeClaim:
            claimName: plex-zfstranscode-pvc
        - name: lily
          persistentVolumeClaim:
            claimName: plex-lily-pvc
        - name: abbie
          persistentVolumeClaim:
            claimName: plex-abbie-pvc
