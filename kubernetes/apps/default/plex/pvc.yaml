---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-zfstranscode-pv
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /mnt/media/plex_transcode
    server: truenas1-nfs.torquasmvo.internal
  mountOptions:
    - nfsvers=4.1
    - noatime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-zfstranscode-pvc
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  volumeName: plex-zfstranscode-pv
  storageClassName: ''
