# kubernetes/apps/default/bazarr/deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: default
  labels:
    app: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: bazarr
          image: ghcr.io/home-operations/bazarr:1.6.2@sha256:6c40dfa683f767d28d1dc502837ed0a5a57682a84231f03e704e2b3f61b25a46
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6767
          env:
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: config
              mountPath: /config          # Longhorn PVC (RWO)
            - name: movies
              mountPath: /movies          # NFS PV/PVC (RWX)
            - name: tv
              mountPath: /tv              # NFS PV/PVC (RWX)
          # (Optional) basic health checks
          readinessProbe:
            httpGet:
              path: /
              port: 6767
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 6767
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config      # Longhorn PVC you created earlier
        - name: movies
          persistentVolumeClaim:
            claimName: media-movies-pvc   # NFS PVC (default ns)
        - name: tv
          persistentVolumeClaim:
            claimName: media-tv-pvc       # NFS PVC (default ns)
