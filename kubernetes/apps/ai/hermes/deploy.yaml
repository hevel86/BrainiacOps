apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: default
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      annotations:
        hermes.brainiacops.io/setup-revision: "2026-11-18-3"
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: setup
          image: nousresearch/hermes-agent:v0.23.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /tmp/scripts/setup.sh
          env:
            - name: HOME
              value: "/opt/data"
            - name: GITHUB_USERNAME
              value: "hevel86"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GH_TOKEN
                  optional: true
            - name: BRAINIAC_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GH_TOKEN
                  optional: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: scripts
              mountPath: /tmp/scripts
              readOnly: true
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v0.23.5
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          env:
            - name: TZ
              value: "America/New_York"
            - name: HOME
              value: "/opt/data"
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            - name: HERMES_GATEWAY_BOOTSTRAP_STATE
              value: "running"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "127.0.0.1"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_API_SERVER_KEY
            - name: GITHUB_USERNAME
              value: "hevel86"
            - name: GIT_ASKPASS
              value: "/opt/data/.local/bin/git-askpass"
            - name: GIT_TERMINAL_PROMPT
              value: "0"
            - name: TALOSCONFIG
              value: "/var/run/secrets/hermes-talos-reader/talosconfig"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GH_TOKEN
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GH_TOKEN
                  optional: true
            - name: BRAINIAC_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GH_TOKEN
                  optional: true
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
            - name: HASS_URL
              value: "https://homeassistant.torquasmvo.com"
            - name: HASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-homeassistant
                  key: HASS_TOKEN
          startupProbe:
            httpGet:
              path: /api/health
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: dashboard
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: talos-reader
              mountPath: /var/run/secrets/hermes-talos-reader
              readOnly: true
            - name: bazarr-api
              mountPath: /var/run/secrets/hermes-bazarr
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
        - name: gateway-tls
          image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
          command: [nginx, -c, /etc/gateway/gateway-nginx.conf, -g, "daemon off;"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: gateway-tls
              containerPort: 8443
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 96Mi
          volumeMounts:
            - name: gateway-proxy-config
              mountPath: /etc/gateway
              readOnly: true
            - name: gateway-tls
              mountPath: /etc/gateway-tls
              readOnly: true
            - name: gateway-proxy-tmp
              mountPath: /tmp
            # Mask the default ServiceAccount mount for this sidecar only.
            - name: gateway-proxy-no-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: bazarr-api
          secret:
            secretName: hermes-bazarr
            defaultMode: 288
            optional: true
        - name: gateway-proxy-config
          configMap:
            name: hermes-gateway-proxy
        - name: gateway-tls
          secret:
            secretName: hermes-api-tls
            defaultMode: 288
        - name: gateway-proxy-tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: gateway-proxy-no-token
          emptyDir: {}
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data-pvc-lh
        - name: scripts
          configMap:
            name: hermes-scripts
            defaultMode: 493
        - name: talos-reader
          secret:
            secretName: hermes-talos-reader
            optional: true
            defaultMode: 288
            items:
              - key: talosconfig
                path: talosconfig
