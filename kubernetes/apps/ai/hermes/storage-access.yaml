# Additive storage-test access for the existing default/hermes identity.
# Creates are namespace-scoped: RBAC cannot name-restrict CREATE requests.
# Remove this file's kustomization entry after the approved migration window.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-snapshot-reader
rules:
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
      - volumesnapshotclasses
      - volumesnapshotcontents
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-snapshot-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-snapshot-reader
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-tautulli-storage-test
  namespace: default
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - create
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    resourceNames:
      - tautulli-migration-test
    verbs:
      - delete
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    resourceNames:
      - tautulli-migration-snapshot
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-tautulli-storage-test
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-tautulli-storage-test
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
