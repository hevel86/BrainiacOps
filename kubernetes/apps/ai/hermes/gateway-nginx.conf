worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 660s;
    # A variable loads the projected cert at handshake (no renewal restart).
    map $ssl_server_name $tls_path {
        default /etc/gateway-tls;
    }
    server {
        listen 8443 ssl;
        server_name hermes-api.torquasmvo.com;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate $tls_path/tls.crt;
        ssl_certificate_key $tls_path/tls.key;
        location = /health { proxy_pass http://127.0.0.1:8642; }
        location = /v1/models { proxy_pass http://127.0.0.1:8642; }
        location ~ ^/v1/runs(?:/[^/]+(?:/(?:events|stop))?)?$ {
            proxy_pass http://127.0.0.1:8642;
        }
        location / { return 404; }
    }
}
