apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard-canonical
  namespace: default
  labels:
    app: hermes
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes
                port:
                  name: dashboard
