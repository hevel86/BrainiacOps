apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: default
  labels:
    app: hermes
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: hermes
spec:
  type: ClusterIP
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: dashboard
      protocol: TCP
