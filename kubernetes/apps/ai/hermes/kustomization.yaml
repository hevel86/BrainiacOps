apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bitwarden-secrets.yaml
  - homeassistant-bitwarden.yaml
  - bazarr-bitwarden.yaml
  - deploy.yaml
  - pvc.yaml
  - rbac.yaml
  - svc.yaml
  - dashboard-canonical-ingress.yaml
  - gateway.yaml
  - storage-access.yaml
configMapGenerator:
  - name: hermes-scripts
    files:
      - scripts/setup.sh
      - scripts/git-askpass.sh
  - name: hermes-gateway-proxy
    files:
      - gateway-nginx.conf
generatorOptions:
  disableNameSuffixHash: true
