worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 660s;
    # KubeDNS service IP in BrainiacOps. Use Service DNS, not a pinned backend IP.
    resolver 10.96.0.10 valid=30s ipv6=off;
    resolver_timeout 5s;
    server {
        listen 127.0.0.1:18642;
        location / {
            set $hermes_upstream hermes-api.default.svc.cluster.local;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_server_name on;
            proxy_ssl_name hermes-api.torquasmvo.com;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host hermes-api.torquasmvo.com;
            proxy_set_header Connection "";
            proxy_pass https://$hermes_upstream;
        }
    }
}
