apiVersion: v1
kind: Service
metadata:
  name: paperclip-api
  namespace: default
  labels:
    app: paperclip
spec:
  type: ClusterIP
  selector:
    app: paperclip
  ports:
    - name: https
      port: 443
      targetPort: private-api
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: paperclip-api-tls
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: paperclip-api-tls
  dnsNames:
    - paperclip-api.torquasmvo.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    rotationPolicy: Always
