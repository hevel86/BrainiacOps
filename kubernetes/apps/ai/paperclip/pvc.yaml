apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-data-pvc-lh
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    app: paperclip
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-prod
  resources:
    requests:
      storage: 20Gi
